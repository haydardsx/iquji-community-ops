<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iQuji Ops</title>
    <script>
      (() => {
        const key = "iquops.theme";
        const fallback = "system";
        const resolve = (mode) => {
          if (mode === "light" || mode === "dark") return mode;
          return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        };
        try {
          const stored = localStorage.getItem(key);
          const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : fallback;
          const resolved = resolve(mode);
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          const resolved = resolve(fallback);
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
